# MVMP — Redis configuration for Docker (Phase 14)
#
# Bind to all interfaces INSIDE the container (Docker network isolates it).
# The container's port 6379 is NOT published to the host.

# Network
bind 0.0.0.0 ::1
protected-mode yes
port 6379

# Auth (required)
# The password is NOT hardcoded here. It is passed via the `--requirepass`
# CLI flag in docker-compose.yml, sourced from the MVMP_REDIS_PASSWORD env var.
# This avoids baking secrets into config files.

# Memory — same as Native Phase 13
maxmemory 256mb
# CRITICAL: noeviction so BullMQ jobs are never silently dropped
maxmemory-policy noeviction

# Persistence — AOF + RDB
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Timeouts
timeout 300
tcp-keepalive 60

# Logging
loglevel notice

# Do NOT expose admin commands to the network
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
