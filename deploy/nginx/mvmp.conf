# MVMP Phase 13 — Nginx reverse proxy configuration
#
# File: /etc/nginx/sites-available/mvmp.conf
#
# Variables to substitute before enabling:
#   SERVER_NAME       — your domain (e.g. mvmp.example.com) or _ for any host
#   APP_UPSTREAM      — 127.0.0.1:3000  (Next.js standalone API)
#   REALTIME_UPSTREAM — 127.0.0.1:3003  (socket.io gateway)
#   CERT_PATH         — /etc/letsencrypt/live/$SERVER_NAME/fullchain.pem
#   KEY_PATH          — /etc/letsencrypt/live/$SERVER_NAME/privkey.pem
#
# Internal ports (3000/3003/3004) MUST NOT be exposed publicly — only Nginx
# is allowed to proxy to them.

# Upstream definitions (loopback only)
upstream mvmp_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream mvmp_realtime {
    server 127.0.0.1:3003;
    keepalive 16;
}

# Rate-limit zone — 10 req/s per IP, bursty traffic handled per-location
limit_req_zone $binary_remote_addr zone=mvmp_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mvmp_chat:10m      rate=20r/m;
limit_req_zone $binary_remote_addr zone=mvmp_login:10m     rate=5r/m;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=mvmp_conn:10m;

# HTTP — redirect everything to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # ACME challenge passthrough
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_NAME;

    ssl_certificate     CERT_PATH;
    ssl_certificate_key KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self';" always;

    # ---- Request size limit ----
    client_max_body_size 10m;

    # ---- Logging (no API keys in URLs — they are in headers / body) ----
    access_log /var/log/nginx/mvmp.access.log;
    error_log  /var/log/nginx/mvmp.error.log warn;

    # Connection-level limit
    limit_conn mvmp_conn 20;

    # ---- Static assets (long cache) ----
    location /_next/static/ {
        proxy_pass http://mvmp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /robots.txt {
        proxy_pass http://mvmp_api;
        access_log off;
    }

    # ---- WebSocket / socket.io (realtime) ----
    # socket.io is served from /socket.io/ by default. MVMP realtime uses
    # path: "/" with port 3003. The Caddyfile in dev uses ?XTransformPort=3003
    # to multiplex. In production we expose /socket.io/ directly.
    location /socket.io/ {
        proxy_pass http://mvmp_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # No rate limit on websocket upgrade — would block long polls
    }

    # ---- Chat API — stricter rate limit (20/min per IP) ----
    location /api/chat {
        limit_req zone=mvmp_chat burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://mvmp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Auth endpoints — stricter (5/min per IP) ----
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=mvmp_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://mvmp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Generic API ----
    location /api/ {
        limit_req zone=mvmp_general burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://mvmp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Everything else → Next.js (SSR + frontend) ----
    location / {
        limit_req zone=mvmp_general burst=50 nodelay;
        proxy_pass http://mvmp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
